name: Keep sales cloud alive

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup ExtendsClass cloud store to GitHub
        run: |
          set -euo pipefail
          POINTER=data/cloud-pointer.json
          BIN_ID=$(python3 -c "import json; d=json.load(open('$POINTER')); print(d.get('binId') or 'bcafcbb')")
          BACKUP_ID=$(python3 -c "import json; d=json.load(open('$POINTER')); print(d.get('backupBinId') or 'eaaaadb')")
          echo "Using bins: $BIN_ID / $BACKUP_ID"

          python3 - <<PY
          import json, pathlib, datetime, urllib.request

          def load_bin(bin_id: str):
            url = f'https://extendsclass.com/api/json-storage/bin/{bin_id}?t={datetime.datetime.utcnow().timestamp()}'
            try:
              with urllib.request.urlopen(url, timeout=20) as r:
                data = json.loads(r.read().decode())
              if isinstance(data.get('orders'), list) and isinstance(data.get('history'), list):
                return data
            except Exception as e:
              print('read fail', bin_id, e)
            return None

          def newer(a, b):
            if not a: return b
            if not b: return a
            ta = a.get('updatedAt') or ''
            tb = b.get('updatedAt') or ''
            return a if ta >= tb else b

          primary = load_bin("$BIN_ID")
          backup = load_bin("$BACKUP_ID")
          data = newer(primary, backup)
          if not data:
            print('Cloud read failed; keeping existing sales-store.json')
            raise SystemExit(0)

          existing_path = pathlib.Path('data/sales-store.json')
          if existing_path.exists():
            try:
              existing = json.loads(existing_path.read_text())
              old_n = len(existing.get('orders') or [])
              new_n = len(data.get('orders') or [])
              old_t = existing.get('updatedAt') or ''
              new_t = data.get('updatedAt') or ''
              if new_n < old_n and new_t <= old_t:
                print(f'Refusing shrink backup ({new_n} < {old_n}) with older/equal timestamp')
                raise SystemExit(0)
            except SystemExit:
              raise
            except Exception:
              pass

          if not isinstance(data.get('deletedIds'), dict):
            data['deletedIds'] = {}
          data['monthlyTarget'] = float(data.get('monthlyTarget') or 0)
          data['updatedAt'] = data.get('updatedAt') or (datetime.datetime.utcnow().isoformat() + 'Z')

          # Mirror newest snapshot to both bins
          body = json.dumps(data, ensure_ascii=False).encode()
          for bin_id in ["$BIN_ID", "$BACKUP_ID"]:
            req = urllib.request.Request(
              f'https://extendsclass.com/api/json-storage/bin/{bin_id}',
              data=body,
              method='PUT',
              headers={'Content-Type': 'text/plain;charset=UTF-8', 'Accept': 'application/json'},
            )
            try:
              with urllib.request.urlopen(req, timeout=20) as r:
                print('mirror', bin_id, r.status)
            except Exception as e:
              print('mirror fail', bin_id, e)

          pathlib.Path('data/sales-store.json').write_text(
            json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          )
          pathlib.Path('data/cloud-pointer.json').write_text(
            json.dumps({
              'provider': 'extendsclass',
              'binId': "$BIN_ID",
              'backupBinId': "$BACKUP_ID",
              'updatedAt': datetime.datetime.utcnow().isoformat() + 'Z',
            }, indent=2) + '\n'
          )
          print('orders', len(data['orders']), 'history', len(data['history']), 'updated', data['updatedAt'])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cloud-pointer.json data/sales-store.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: backup sales cloud store"
            git push
          fi
