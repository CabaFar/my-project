name: Keep sales cloud alive

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup ExtendsClass cloud store to GitHub
        run: |
          set -euo pipefail
          POINTER=data/cloud-pointer.json
          BIN_ID=$(python3 -c "import json; d=json.load(open('$POINTER')); print(d.get('binId') or d.get('blobId') or 'bcafcbb')")
          echo "Using bin: $BIN_ID"

          if ! curl -fsS "https://extendsclass.com/api/json-storage/bin/${BIN_ID}?t=$(date +%s)" \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' -o /tmp/cloud.json; then
            echo "Cloud read failed; keeping existing sales-store.json"
            exit 0
          fi

          python3 - <<PY
          import json, pathlib, datetime
          bin_id = "$BIN_ID" or "bcafcbb"
          raw = pathlib.Path('/tmp/cloud.json').read_text()
          try:
            data = json.loads(raw)
          except Exception:
            print('Invalid JSON from cloud; abort backup')
            raise SystemExit(0)
          if not isinstance(data.get('orders'), list) or not isinstance(data.get('history'), list):
            print('Cloud payload missing orders/history; abort backup')
            raise SystemExit(0)

          # Never replace a richer GitHub backup with a clearly emptier cloud snapshot
          existing_path = pathlib.Path('data/sales-store.json')
          if existing_path.exists():
            try:
              existing = json.loads(existing_path.read_text())
              old_n = len(existing.get('orders') or [])
              new_n = len(data.get('orders') or [])
              old_t = existing.get('updatedAt') or ''
              new_t = data.get('updatedAt') or ''
              if new_n < old_n and new_t <= old_t:
                print(f'Refusing shrink backup ({new_n} < {old_n}) with older/equal timestamp')
                raise SystemExit(0)
            except SystemExit:
              raise
            except Exception:
              pass

          if not isinstance(data.get('deletedIds'), dict):
            data['deletedIds'] = {}
          data['monthlyTarget'] = float(data.get('monthlyTarget') or 0)
          data['updatedAt'] = data.get('updatedAt') or (datetime.datetime.utcnow().isoformat() + 'Z')
          pathlib.Path('data/sales-store.json').write_text(
            json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          )
          pathlib.Path('data/cloud-pointer.json').write_text(
            json.dumps({
              'provider': 'extendsclass',
              'binId': bin_id,
              'updatedAt': datetime.datetime.utcnow().isoformat() + 'Z',
            }, indent=2) + '\n'
          )
          print('orders', len(data['orders']), 'history', len(data['history']))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cloud-pointer.json data/sales-store.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: backup sales cloud store"
            git push
          fi
